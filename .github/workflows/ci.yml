name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit test suite
        run: |
          pytest -q

      - name: Verify Python compilation
        run: |
          python -m py_compile app.py app_core.py

      - name: Validate bundled JSON data files
        run: |
          python -m json.tool data/national_fines.json > /dev/null
          python -m json.tool data/vehicle_types.json > /dev/null
          python -m json.tool data/state_data.json > /dev/null
          python -m json.tool data/metadata.json > /dev/null
          python -m json.tool data/legal_sections.json > /dev/null
          python -m json.tool data/citizen_rights.json > /dev/null

      - name: Verify offline import integrity
        run: |
          python -c "import app_core; print('Loaded', len(app_core.NATIONAL_FINES), 'fines and', len(app_core.STATE_DATA), 'locations successfully.')"
